[project]
name = "hubexplorer"
version = "1.0"
description = "Unofficial, thin wrapper around the public Hugging Face Hub API for model and dataset discovery and evaluation. Not affiliated with Hugging Face."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hubexplorer = "hubexplorer.cli:main"

[project.urls]
Repository = "https://github.com/danielrosehill/HF-URLs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubexplorer"]

[tool.hatch.build.targets.wheel.force-include]
"data/hf-urls.json" = "hubexplorer/data/hf-urls.json"
"data/languages.json" = "hubexplorer/data/languages.json"
